<!DOCTYPE html>
{% extends 'base.html' %}
{% block title%}Create New List{% endblock %}
{% block content %}
<div>
<h3>Create a New To-Do List</h3>
<form method="POST" action="/lists/new/" class="form-group">
    {% csrf_token %}
    <div class="input-group mb-3">
        <div class="input-group-prepend">
            <button type="submit" name="save" class="btn btn-success">Create List</button>
        </div>   
        {{form_list.name}}
    </div>
</form>
</div>
<br>
{% endblock %}
