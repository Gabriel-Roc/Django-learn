<!DOCTYPE html>
{% extends "app_test/base.html" %}
{% block title %}Log-in Here{% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<form method="POST" class="form-group">
    {% csrf_token %}
    {{ form|crispy }}
    <p class="mt-2">Don't have an account? Create one <a href="/register">Here</a></p>    
    <button type="submit" class=" btn btn-success">Log-in</button>
</form>
{% endblock %}
